name: Deploy

# CI とは別ワークフローにしつつ、検証を飛ばして公開されないよう workflow_run で
# CI の完了を受けて起動する。CI が落ちた回は下の if で弾く。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never let two deploys race for the same Worker or D1 database.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate and deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # workflow_run の既定チェックアウトは default ブランチの先端。CI が検証した
      # まさにそのコミットを公開するため、head_sha を明示する。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Must run before the deploy: a Worker released against an unmigrated
      # database answers every request with a 500.
      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      - name: Deploy Worker
        run: npm run deploy

      # The page links /styles.css?v=<hash from the asset ETag>. Serving it from
      # a bare, stable URL is how a CSS change once reached browsers that still
      # held the previous copy, leaving new markup styled by an old stylesheet.
      # Set the PRODUCTION_URL repository variable to enable this check.
      - name: Check the deployed page busts the stylesheet cache
        if: vars.PRODUCTION_URL != ''
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          page="$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${PRODUCTION_URL%/}/")"
          href="$(printf '%s' "$page" | grep -o '/styles\.css?v=[A-Za-z0-9]\+' | head -1)"
          if [ -z "$href" ]; then
            echo "::error::The deployed page links an unversioned stylesheet; a CSS change would reach browsers holding a stale copy."
            exit 1
          fi
          curl -fsS -o /dev/null "${PRODUCTION_URL%/}$href"
          echo "Stylesheet is cache-busted: $href"
