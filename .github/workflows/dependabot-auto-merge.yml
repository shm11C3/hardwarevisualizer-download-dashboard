name: Dependabot auto-merge

on:
  pull_request:

# Dependabot の PR に対して既定の GITHUB_TOKEN は読み取り専用になるため、
# ここで明示的に書き込み権限を与える。
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge for non-major updates
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # --auto はマージせず「チェックが全て通ったらマージする」予約を入れるだけ。
      # 実際のマージは CI ワークフローの verify ジョブ、つまり型チェック、Biome、
      # テストが成功してから GitHub 側で行われる。
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Leave major updates for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "::notice::Major update detected; merge manually after reviewing the changelog."
